name: Build Aletheian Writer Android

on:
  push:
    branches: [writer-android-build]
    paths: ['android-writer-source.b64.part12']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Reconstruct source
        run: |
          cat android-writer-source.b64.part* | base64 -d > writer.tar.xz
          tar -xJf writer.tar.xz
          sed -i 's/import android\.app\.PrintManager;/import android.print.PrintManager;/' AletheianWriter-Android/app/src/main/java/org/aletheian/writer/MainActivity.java
          sed -i 's/setImmersive(/setWriterImmersive(/g' AletheianWriter-Android/app/src/main/java/org/aletheian/writer/MainActivity.java
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
        working-directory: AletheianWriter-Android
      - name: Verify APK
        run: |
          test -s AletheianWriter-Android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum AletheianWriter-Android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AletheianWriter-Android-1.0.0
          path: AletheianWriter-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
